openapi: 3.0.1
info:
  title: Places API
  description: 'The Places API is responsible for giving (location) data about different places. A Place is an abstraction of a piece of information that is related to a specific location, like addresses, Google POI''s, bus/tram stops, stations and their facilities, greenwheels cars, cities etc.'
  version: '1.0'
servers:
  - url: https://gateway.apiportal.ns.nl/places-api
paths:
  '/v2/autosuggest/{type}/{id}':
    get:
      tags:
        - Autosuggest
      summary: Auto suggest for type
      description: Request a specific autosuggest resource. This endpoint is deprecated. Please use /api/v2/places
      operationId: autoSuggestForType
      parameters:
        - name: type
          in: path
          description: The type of place.
          required: true
          schema:
            type: string
        - name: id
          in: path
          description: The id of the place.
          required: true
          schema:
            type: string
        - name: x-api-key
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Information about a specific place; Representation contains payload of type Location
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationLocation'
        '400':
          description: Information about a specific place; Representation contains payload of type Location
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationLocation'
        '500':
          description: Information about a specific place; Representation contains payload of type Location
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationLocation'
  /v2/autosuggest:
    get:
      tags:
        - Autosuggest
      summary: Auto suggest
      description: Performs an auto suggest based on the given types and q. The default types on which is searched are address and stops. This endpoint is deprecated. Please use /api/v2/places
      operationId: autoSuggest
      parameters:
        - name: q
          in: query
          description: 'q, does a full text search'
          schema:
            type: string
          example: 'ut,kiosk,jrvs'
        - name: type
          in: query
          description: Multi valued array (comma separated list)
          schema:
            type: array
            items:
              type: string
          example: 'poi,station-taxi,stationfacility,greenwheels,address,city,stop'
        - name: 'type[]'
          in: query
          description: 'Multi valued array for iOS, equivalent with type'
          schema:
            type: array
            items:
              type: string
        - name: session_token
          in: query
          description: 'A session token, used to group the query and selection phases of a user autocomplete search into a discrete session for billing purposes'
          schema:
            type: string
        - name: x-api-key
          in: header
          schema:
            type: string
      responses:
        '200':
          description: List of available places; Representation contains payload of type List<Place>
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationListPlace'
        '400':
          description: List of available places; Representation contains payload of type List<Place>
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationListPlace'
        '500':
          description: List of available places; Representation contains payload of type List<Place>
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/RepresentationListPlace'
  /v1/scooter-details:
    get:
      tags:
        - Scooter
      summary: getScooterDetails
      operationId: getScooterDetails
      parameters:
        - name: id
          in: query
          description: Scooter id url encoded
          required: true
          schema:
            type: string
          example: '%23mcp%3AV%3Acheck%3A7413a8a8-6562-4f71-a06b-5960a086861f'
        - name: Accept-Language
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NearbyMeGetScooterDetailsResponse'
              example:
                id: string
                name: string
                lat: 0
                lng: 0
                thumbnail:
                  uri: string
                distance: 0
                address: string
                batteryInfo:
                  text: string
                  level: EMPTY
                  iconId: string
                button:
                  weblink:
                    uri: string
                  deepLink:
                    uri: string
                  buttonText: string
  /v3/nearbyme:
    get:
      tags:
        - NearbyMeLocation
      summary: Get nearby me locations v3
      description: Get nearby me locations v3
      operationId: locationsNearbyMeV3
      parameters:
        - name: minLat
          in: query
          description: 'Latitude of the south-west coordinate of the map. '
          required: true
          schema:
            type: number
            format: double
          example: 52.089319
        - name: minLng
          in: query
          description: Longitude of the south-west coordinate of the map.
          required: true
          schema:
            type: number
            format: double
          example: 5.110169
        - name: maxLat
          in: query
          description: 'Latitude of the north-east coordinate of the map. '
          required: true
          schema:
            type: number
            format: double
          example: 52.089319
        - name: maxLng
          in: query
          description: Longitude of the north-east coordinate of the map.
          required: true
          schema:
            type: number
            format: double
          example: 5.110169
        - name: zoomLevel
          in: query
          description: Zoomlevel of the map for which data should be returned. See https://developers.google.com/maps/documentation/android-sdk/views#zoom
          schema:
            type: integer
            format: int32
            default: 6
          example: 6
        - name: limit
          in: query
          description: Limit the number of results returned
          schema:
            type: integer
            format: int32
            default: 200
          example: 50
        - name: filterTypes
          in: query
          description: 'StationaryFilter (except OV), NearbyMeLocationType (only SHARED_BIKE, SHARED_CAR and SHARED_SCOOTER), SharedModalityProvider (e.g. DOTT, CHECK), or VariationEnum (e.g. ELECTRIC) that should be applied in the search.'
          schema:
            type: array
            items:
              type: string
            default: '[ ]'
          example: 'STATION,BUS,SHARED_BIKE,DOTT,ELECTRIC,OV_FIETS'
        - name: disabledModalities
          in: query
          description: 'DisabledModalities that could be applied in the search. If identical to filterTypes <should not be possible>, both will be ignored and all types returned'
          schema:
            type: array
            items:
              type: string
            default: '[ ]'
          example: 'DLS, DEF'
        - name: appVersionCapabilities
          in: query
          description: List of supported combinations of modality type and provider
          schema:
            type: array
            items:
              type: string
            default: '[ ]'
          example: 'DLF-Dott,DLS-Check,DLA-GreenWheels'
        - name: enableSubfilters
          in: query
          description: Feature switch to enable top level filters with subfilters
          schema:
            type: boolean
        - name: Accept-Language
          in: header
          schema:
            type: string
            default: nl
        - name: X-MmVehicleExtra
          in: header
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/NearbyMeGetLocationsResponseV3'
              example:
                locations:
                  - id:
                      value: string
                      type: string
                    lat: 0
                    lng: 0
                    name: string
                    category: STATION
                    provider: string
                    type: BUS
                    subType: CAR_COMPACT
                    distance: 0
                    description:
                      full: string
                      minimal: string
                      subDescription: string
                    routeShortNames:
                      - string
                    platform:
                      code: string
                      label: string
                    batteryInfo:
                      text: string
                      level: EMPTY
                      iconId: string
                      iconColor: string
                      percentage: string
                    modalityProviderMarkerInfo:
                      baseUrl: string
                    sharedModalityBottomSheetExtraInfo:
                      header: string
                      content: string
                messages:
                  - priority: 0
                    value: string
                    type: Success
