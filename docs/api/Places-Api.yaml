          description: "Identifier of payment method card. Only required when sessionId needs to be propagated in deeplink to Check.\n\nCNTRCTID -> provide the Flex card engraved ID\n\nSCID -> provide the Business card contract ID\n\nMAID -> provide the OVPas Master Agreement ID\n"
